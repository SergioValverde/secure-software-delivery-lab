name: AWS OIDC Demo

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Assume RoleOIDC via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::592931547242:role/RoleOIDC
          aws-region: eu-central-1

      - name: Check first identity
        run: aws sts get-caller-identity

      - name: Assume DevelopmentDeploymentRole
        run: |
          aws sts assume-role \
            --role-arn arn:aws:iam::592931547242:role/DevelopmentDeploymentRole \
            --role-session-name development-test
